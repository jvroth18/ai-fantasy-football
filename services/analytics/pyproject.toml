[project]
name = "ai-fantasy-football-analytics"
version = "0.1.0"
description = "Reproducible analytics for ai-fantasy-football"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.0",
  "joblib>=1.5.0",
  "numpy>=2.2.0,<2.5.0",
  "polars>=1.35.0",
  "scikit-learn>=1.7.0",
]

[project.scripts]
ai-ff-analytics = "ai_fantasy_football_analytics.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_fantasy_football_analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
