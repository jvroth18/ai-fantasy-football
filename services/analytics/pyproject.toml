[project]
name = "ai-fantasy-football-analytics"
version = "0.1.0"
description = "Reproducible analytics for ai-fantasy-football"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_fantasy_football_analytics"]
